name: PNU Notice Brief

on:
  schedule:
    # 09:00 UTC = 18:00 KST (매일)
    - cron: "0 9 * * *"
  workflow_dispatch: # 수동 실행 버튼
    inputs:
      dry_run:
        description: "디스코드에 보내지 않고 로그로만 확인"
        type: boolean
        default: false
      date:
        description: "이 날짜 게시분을 보내기 (YYYY-MM-DD, 비우면 어제)"
        type: string
        default: ""

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python brief.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
